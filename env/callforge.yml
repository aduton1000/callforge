# ═══════════════════════════════════════════════════════════════════════════
#  CallForge — primary (core) pinned conda/mamba environment
#  Covers: read QC, trimming, alignment, dedup/BQSR, HsMetrics/coverage,
#          GATK joint SNV/indel calling + filtering, GATK gCNV, MultiQC,
#          and the Python plotting/QC layer (figures + cohort dashboard).
#
#  Create:  mamba env create -f env/callforge.yml
#  Apple Silicon (arm64): bioconda lacks osx-arm64 builds for some tools
#    (e.g. gatk4, bwa-mem2, deepvariant). Create the env under Rosetta so the
#    x86_64 builds resolve, and the report flags which stages run emulated:
#       CONDA_SUBDIR=osx-64 mamba env create -f env/callforge.yml
#  Linux/HPC is native (no emulation).
#
#  Tool-domains that conflict in a single solve live in their own env files:
#    env/annotate.yml  env/cohortqc.yml  env/str.yml  env/cnv.yml
#    env/happy.yml  env/burden.yml  env/deepvariant.yml
#  Each module pins itself to the right env via `conda "${projectDir}/env/<x>.yml"`.
# ═══════════════════════════════════════════════════════════════════════════
name: callforge
channels:
  - conda-forge
  - bioconda
dependencies:
  # ---- read QC + trimming ----
  - fastqc=0.12.1
  - fastp=0.23.4
  # ---- alignment + BAM ops ----
  - bwa-mem2=2.2.1
  - bwa=0.7.18                 # fallback aligner where bwa-mem2 lacks a build
  - samtools=1.21
  - htslib=1.21                # bgzip / tabix
  # ---- calling + filtering ----
  - gatk4=4.6.1.0              # HaplotypeCaller, GenotypeGVCFs, gCNV, VariantFiltration
  - picard=3.3.0              # CollectHsMetrics, MarkDuplicates (also in gatk4)
  - bcftools=1.21
  - bedtools=2.31.1
  - mosdepth=0.3.8            # fast per-target / per-gene depth
                              # (native osx-arm64: use >=0.3.11 — 0.3.8 has no arm64
                              #  build; or create the env via CONDA_SUBDIR=osx-64)
  # ---- aggregate reporting ----
  - multiqc=1.25
  # ---- python + plotting / QC layer ----
  - python=3.11
  - pip=24.2
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.2
  - matplotlib-base=3.9.2
  - scikit-allel=1.3.8        # variant-matrix QC (Ti/Tv, het/hom, PCA helpers)
  - pysam=0.22.1
  - pyfaidx=0.8.1.1
  - jinja2=3.1.4              # self-contained HTML cohort dashboard
  - pyyaml=6.0.2
