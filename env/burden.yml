# env/burden.yml — Stage 14 gene-burden, PRODUCTION engine: regenie (Firth-corrected,
# covariate-adjusted) + plink2 for genotype prep. The R alternative (SKAT-O, with STAAR
# packaged) lives in env/skat.yml — SPLIT on purpose: regenie 3.6 pins boost-cpp 1.74,
# whose ICU requirement cannot coexist with r-base 4.3.x in one env.
name: callforge-burden
channels:
  - conda-forge
  - bioconda
dependencies:
  - regenie=3.6
  - plink2=2.00a5.10          # genotype prep (BGEN/PGEN) for regenie
  - bcftools=1.21
  - procps-ng                  # `ps` — required by Nextflow's task wrapper inside containers
